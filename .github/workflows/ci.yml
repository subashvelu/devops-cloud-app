# Continuous Integration: "does this code work?"
#
# Runs in 2 situations:
#   1. On every pull request to main
#   2. When deploy.yml calls it (workflow_call) before deploying,
#      so tests are written once and not duplicated.
name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        run: docker build -t devops-app:test .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 devops-app:test
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then
              echo " <- container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs smoke
          exit 1

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false

      - name: Validate syntax
        run: terraform validate
