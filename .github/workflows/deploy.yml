# Continuous Deployment: "put the working code on AWS".
#
# Flow:  push to main -> run CI -> build image -> push to ECR -> tell EC2 (via SSM) to run it
name: Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch: # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: read

# Never run two deployments at the same time (they would fight over the container).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Re-use the tests from ci.yml. Deploy only continues if this passes.
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push to ECR, deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tagged with commit SHA and latest)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy on EC2 via SSM and wait for the result
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          # Commands that will run ON the EC2 instance.
          # Pull first, so if the pull fails the old container keeps running.
          COMMANDS=$(jq -nc \
            --arg region "$REGION" \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" '[
              "set -e",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker stop devops-app || true",
              "docker rm devops-app || true",
              "docker run -d --name devops-app --restart always -p 5000:5000 \($image)",
              "for i in $(seq 1 15); do curl -fs http://localhost:5000/health && exit 0; sleep 2; done; docker logs --tail 50 devops-app; exit 1"
            ]')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "$REGION" \
            --comment "Deploy $IMAGE_TAG" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command id: $CMD_ID"

          # Wait until the command finishes (waiter gives up after ~100 seconds).
          STATUS=0
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || STATUS=$?

          echo "------ stdout from EC2 ------"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" --query StandardOutputContent --output text
          echo "------ stderr from EC2 ------"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" --query StandardErrorContent --output text

          # Non-zero here makes the GitHub job RED if the deploy failed.
          exit $STATUS
